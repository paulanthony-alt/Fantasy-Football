<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Gridiron Edge — NFL analytics for fantasy lineups, trades and betting research." />
    <title>Gridiron Edge</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('ge:ui') || '{}');
        var theme = (t.state && t.state.theme) || 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
